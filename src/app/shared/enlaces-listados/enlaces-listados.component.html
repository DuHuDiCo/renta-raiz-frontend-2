<section *ngIf="grupos.length" class="px-4 md:px-12 py-10 bg-gray-50 border-t border-gray-200"
  aria-label="Búsquedas de inmuebles">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
    <div *ngFor="let grupo of grupos">
      <h2 class="text-base font-bold text-[#080E36] mb-3">{{ grupo.titulo }}</h2>
      <ul class="space-y-1 text-sm">
        <li *ngFor="let enlace of grupo.enlaces">
          <a [routerLink]="enlace.ruta" class="text-gray-700 hover:text-[#CDAD60]">
            {{ enlace.texto }} <span class="text-gray-400">({{ enlace.total }})</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>
