@if (temporal) {
  <div class="flex min-h-screen flex-col items-center justify-center bg-gray-900 px-6 text-center text-white">
    <i class="fas fa-plug-circle-exclamation text-5xl text-yellow-500" aria-hidden="true"></i>
    <h1 class="mt-6 text-2xl font-bold sm:text-3xl">No pudimos cargar esta página</h1>
    <p class="mt-3 max-w-md text-base text-gray-300">
      Tuvimos un problema al traer la información. No es un error tuyo: intenta de nuevo en unos segundos.
    </p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <button type="button" (click)="reintentar()"
        class="cursor-pointer rounded-lg bg-yellow-500 px-6 py-3 font-semibold text-gray-900 transition hover:bg-yellow-600">
        Intentar de nuevo
      </button>
      <a [routerLink]="'/'"
        class="rounded-lg border border-yellow-500 px-6 py-3 font-semibold text-yellow-500 transition hover:bg-yellow-500 hover:text-gray-900">
        Volver al inicio
      </a>
    </div>
  </div>
} @else {
  <div class="flex min-h-screen flex-col items-center justify-center bg-gray-900 text-white">
    <h1 class="text-6xl font-bold text-yellow-500">404</h1>
    <p class="mt-4 text-lg">¡Ups! La página que buscas no existe.</p>
    <a [routerLink]="'/'"
      class="mt-6 cursor-pointer rounded-lg bg-yellow-500 px-6 py-3 font-semibold text-gray-900 transition hover:bg-yellow-600">
      Volver al inicio
    </a>
  </div>
}
