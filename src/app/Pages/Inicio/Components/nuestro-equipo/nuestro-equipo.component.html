<app-navbar  (abrir)="toggleOffcanvas()"></app-navbar>

<div class="flex flex-col">
  <div class="banner-contacto w-full h-[40vh] md:h-[60vh] overflow-hidden">
    <div class="relative w-full h-full">
      <!-- Imagen de Fondo (No se corta en móvil) -->
      <img fetchpriority="high" src="assets/images/equipo-expertos.jpg"
        class="absolute inset-0 w-full h-full object-fill object-top md:object-cover md:object-top lg:object-cover lg:object-top xl:object-cover xl:object-top 2xl:object-cover 2xl:object-top z-10"
        alt="Fondo" />

      <!-- Imagen de Texto (Más grande en móvil) -->
      <div class="absolute inset-0 z-30 flex items-center">
        <img src="assets/images/TEXTOSLIDEREXPERTOS.png"
          class="hidden lg:block w-[100%] md:w-[60%] lg:w-[70%] xl:w-[60%] 2xl:w-[50%] md:mb-16 2xl:mb-0 h-auto object-contain -translate-y-6 md:-translate-y-4 xl:-translate-y-2md:-translate-y-4 xl:-translate-y-[-50px] translate-x-26 md:translate-x-60 lg:translate-x-2 xl:ml-[195px] 2xl:translate-x-64 custom-1024:translate-x-custom-1024"
          alt="Expertos Desktop" />

        <!-- Mobile & Tablet Image (up to lg) -->
        <div class="flex justify-center lg:hidden">
          <img src="assets/images/EXPERTOS-MOVIL.png"
            class="block lg:hidden w-[100%] h-auto object-contain md:-translate-y-[-190px] -translate-y-[-70px] md:w-[90%] sm:w-[70%] xs:w-[70%]"
            alt="Expertos Mobile" />
        </div>
      </div>
    </div>
  </div>

  <div #dropdownContainer>
    <app-barra-filtros></app-barra-filtros>
  </div>

  <!-- CARDS DE MIEMBROS DEL EQUIPO -->
  <section class="w-full px-4 py-40 bg-white flex flex-col items-center">
    <h1 class="text-4xl md:text-5xl font-bold text-[#080E36] text-center mb-4">
      Conoce al increíble equipo
    </h1>
    <h2 class="text-xl md:text-2xl font-normal text-[#9a9b9c] text-center mb-12">
      Que nadie venga a nosotros sin irse mejor y más feliz
    </h2>

    <div class="flex flex-wrap justify-center gap-8 w-full max-w-6xl">
      @for (asesor of equipo; track asesor.id) {
        <div class="bg-white rounded-xl shadow-md p-8 py-10 flex flex-col items-center w-full sm:w-[16.5rem] transition hover:scale-105 duration-300">
          <a [routerLink]="['/portafolio', asesor.id]" class="flex flex-col items-center">
            <img loading="lazy" decoding="async" [src]="asesor.avatar" [alt]="asesor.nombre"
              class="w-32 h-32 rounded-full object-cover" />
            <h3 class="text-lg font-bold text-gray-900 mt-4 text-center">
              {{ asesor.nombre }}
            </h3>
            <p class="text-sm font-medium text-gray-900 text-center">
              {{ asesor.cargo }}
            </p>
            <div class="flex items-center text-gray-600 mt-2">
              <i class="fa-solid fa-phone text-lg"></i>
              <span class="ml-2 text-sm">{{ asesor.telefono }}</span>
            </div>
            <div class="flex items-center text-gray-600 mt-1">
              <i class="fa-solid fa-envelope text-lg"></i>
              <span class="ml-2 text-sm break-all">{{ asesor.email }}</span>
            </div>
          </a>
          <div class="mt-5 w-full flex flex-col gap-2">
            <a [routerLink]="['/asesor', asesor.slug]"
              class="text-center text-sm font-medium text-[#080E36] underline underline-offset-4 decoration-[#CDAD60] hover:text-[#CDAD60]">
              Ver tarjeta digital
            </a>
            <app-compartir-inmueble [url]="urlPerfil(asesor)" [titulo]="asesor.nombre" etiqueta="Compartir asesor"
              [mensaje]="'Te comparto el contacto de ' + asesor.nombre + ', ' + asesor.cargo + ' de Renta Raíz:'"
              evento="compartir_asesor"></app-compartir-inmueble>
          </div>
        </div>
      }
    </div>
  </section>
</div>

<app-volver></app-volver>
<app-footer></app-footer>
<app-botones-flotantes    (abrir)="toggleOffcanvas()"></app-botones-flotantes>
<app-offcanvas-wishlist (cerrarNotificacion)="sincronizarCierre()" [visible]="mostrarOffcanvas" [minimizado]="minimizarOffcanvas" (visibleModalRecorrido)="recibirValorModalRecorrido()"></app-offcanvas-wishlist>

<app-modal-wishlist [mostrarModalRecorrido]="mostrarModalRecorrido" (cerrar)="mostrarModalRecorrido = false"></app-modal-wishlist>
