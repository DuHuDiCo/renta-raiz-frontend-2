<app-navbar-2 [alwaysScrolled]="true"></app-navbar-2>




<div class="flex flex-col items-center px-4 md:px-0 mt-20 pb-3">
  <div class="banner-contacto w-full max-h-[100vh] overflow-hidden" data-carousel="slide" data-carousel-interval="5000">
    <div
      class="relative w-full md:w-3/4 lg:max-w-[3000px] lg:max-h-[1000px] aspect-video mx-auto rounded-xl overflow-hidden shadow-lg">
      <iframe class="w-full h-full"
        src="https://www.youtube.com/embed/Ae5JuC54Ba8?autoplay=1&mute=1&loop=1&playlist=Ae5JuC54Ba8&controls=1&modestbranding=1"
        title="Video de fondo" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
      </iframe>
    </div>
  </div>


</div>
<div class="pt-6 md:pt-24 pb-6" #dropdownContainer>
  <app-barra-filtros-prioritarios [cargando]="isCargando"
    (filtosSelected)="getFiltrosSeleccionados($event)"></app-barra-filtros-prioritarios>
</div>


<div class="w-full pt-12 mb-6  md:mb-12 flex flex-col items-center  px-4">
  <h1 class="text-4xl sm:text-5xl font-bold text-[#080E36] text-center ">
    Nuestros inmuebles {{type}}
  </h1>
  <h2 class="text-xl md:text-2xl font-normal text-[#5c5d5f] text-center">
    No sueñes, ¡hagamos que suceda!
  </h2>
</div>

<div class="relative">
  <!-- Overlay de carga -->
  <div *ngIf="loadingResultadosVenta"
    class="absolute inset-0 bg-white bg-opacity-70 z-40 flex items-center justify-center">
    <div class="flex flex-col items-center">
      <div class="w-10 h-10 border-4 border-[#CDAD60] border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>
  <div *ngFor="let resul of resultados">
    <div class="w-full  transition-all duration-300 ease-in-out px-4 md:px-6 lg:px-10 xl:px-12 md:mt-16" [ngClass]="{
      'md:ml-[24rem] lg:ml-[26rem] xl:ml-[28rem]': isDrawerOpen,
      'md:ml-0': !isDrawerOpen,
      'bg-gray-200': resul.type === 'Oro' || resul.type === 'Diamante',
      

    }" style="padding-top: 10px;">



      <div style="padding-top: 10px;" *ngIf="resultados.length > 0 "
        class="w-full   transition-all duration-300 ease-in-out px-4 md:px-6 lg:px-10 xl:px-16 md:mt-6" [ngClass]="{
      'md:ml-[24rem] lg:ml-[26rem] xl:ml-[28rem]': isDrawerOpen,
      'md:ml-0': !isDrawerOpen
    }">


        <div class="flex flex-col md:flex-row">
          <div class="relative w-full">



            <div class="w-full flex flex-col items-center  px-4">
              <h2 class="text-4xl sm:text-5xl font-bold text-[#080E36] text-center mb-4">
                <i class="fas fa-gem text-blue-500 text-l" title="Propiedad diamante"
                  *ngIf="resul.type === 'Diamante'"></i>
                <i class="fas fa-crown text-yellow-500 text-l" title="Propiedad oro" *ngIf="resul.type === 'Oro'"></i>
                <i class="fas fa-medal text-gray-400 text-l" title="Propiedad plata" *ngIf="resul.type === 'Plata'"></i>
                Inmuebles {{resul.type}}
              </h2>

            </div>

            <!-- Contenido de resultados desktop -->
            <div class=" hidden md:block">
              <div *ngIf="resultados.length > 0 "
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-10 relative z-0">

                <app-tarjeta-inmueble *ngFor="let inmueble of resul.data.data" [inmueble]="inmueble"
                  [nuevaPestana]="true" (agregarCarrito)="agregarFavorito($event)"></app-tarjeta-inmueble>
              </div>
            </div>



            <!-- mobile -->
            <!-- CARRUSEL DE INMUEBLES EN VENTA -->
            <div class="relative block md:hidden   z-10  ">
              <!-- Botones de navegación -->
              <button aria-label="Ver inmuebles anteriores" (click)="scrollCarrusel('venta', 'left')"
                class="hidden md:flex absolute left-0 top-1/2 transform -translate-y-1/2 bg-[#080E36] text-white p-2 rounded-full shadow hover:bg-[#CDAD60] z-20">
                <i class="fas fa-chevron-left"></i>
              </button>

              <div #carruselVenta class="flex overflow-x-auto scroll-smooth space-x-4 mt-10 pb-4 snap-x snap-mandatory"
                style="scrollbar-width: none; -ms-overflow-style: none;">
                <app-tarjeta-inmueble *ngFor="let inmueble of resul.data.data" [inmueble]="inmueble"
                  class="snap-center flex-none w-72 sm:w-80 md:w-96" [nuevaPestana]="true" (agregarCarrito)="agregarFavorito($event)"></app-tarjeta-inmueble>
              </div>

              <button aria-label="Ver más inmuebles" (click)="scrollCarrusel('venta', 'right')"
                class="hidden md:flex absolute right-0 top-1/2 transform -translate-y-1/2 bg-[#080E36] text-white p-2 rounded-full shadow hover:bg-[#CDAD60] z-20">
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>









          </div>




        </div>

        <!-- Paginado -->
        <!-- Contenedor de paginado -->
        <div class="flex items-center justify-center relative mt-12" *ngIf="resul.data.data.length > 0"
          style="padding-bottom: 50px;">

          <!-- Navegación centrada -->
          <nav aria-label="Page navigation" class="absolute left-1/2 -translate-x-1/2">
            <ul class="inline-flex items-center -space-x-px text-sm">
              <li>
                <button (click)="paginaAnterior('ARRIENDO', resul)"
                  [disabled]="resul.paginacion.paginaActualVenta === 1"
                  class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700 disabled:opacity-50">
                  Anterior
                </button>
              </li>

              <li *ngIf="bloqueActualVenta > 0">
                <button (click)="irAlBloqueAnterior('ARRIENDO')" [disabled]="resul.paginacion.bloqueActualVenta === 0"
                  class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 disabled:opacity-50">
                  ...
                </button>
              </li>

              <li *ngFor="let pagina of resul.paginacion.paginasVenta" class="mx-0.5">
                <ng-container *ngIf="pagina === '...'; else paginaBtn">
                  <button
                    class="px-3 py-2 leading-tight border border-gray-300 text-gray-400 bg-white hover:bg-gray-100 rounded">
                    ...
                  </button>
                </ng-container>
                <ng-template #paginaBtn>
                  <button (click)="cambiarPagina(pagina, 'ARRIENDO', resul)" [ngClass]="
                pagina === resul.paginacion.paginaActualVenta
                  ? 'text-white bg-[#CDAD60]'
                  : 'text-gray-500 bg-white hover:bg-gray-100 hover:text-gray-700'
              " class="px-3 py-2 leading-tight border border-gray-300 rounded">
                    {{ pagina }}
                  </button>
                </ng-template>
              </li>

              <li>
                <button (click)="paginaSiguiente('ARRIENDO', resul)"
                  [disabled]="resul.paginacion.paginaActualVenta === resul.paginacion.totalPaginasVenta"
                  class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700 disabled:opacity-50">
                  Siguiente
                </button>
              </li>
            </ul>
          </nav>

        </div>

      </div>
    </div>
  </div>
</div>

<app-botones-flotantes (abrir)="toggleOffcanvas()"></app-botones-flotantes>
<app-offcanvas-wishlist [visible]="mostrarOffcanvas" [minimizado]="minimizarOffcanvas" (cerrarNotificacion)="sincronizarCierre()"
  (visibleModalRecorrido)="recibirValorModalRecorrido()"></app-offcanvas-wishlist>


<app-modal-wishlist [mostrarModalRecorrido]="mostrarModalRecorrido"
  (cerrar)="mostrarModalRecorrido = false"></app-modal-wishlist>
